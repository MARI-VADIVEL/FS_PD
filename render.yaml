services:
  - type: web
    name: fs-pd-backend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://marieswaranv07_db_user:Mathi_Vel%402007@cluster0.eedgrgq.mongodb.net/mining_platform?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_CURRENCY
        value: INR
      - key: CLIENT_URL
        value: https://fs-pd-frontend.onrender.com

  - type: static
    name: fs-pd-frontend
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fs-pd-backend.onrender.com/api/v1
